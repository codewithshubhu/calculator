<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #0b0b0f;
}

.calculator {
  width: 340px;
  padding: 22px;
  border-radius: 30px;
  background: #17171c;
  box-shadow:
    0 25px 60px rgba(0,0,0,.65),
    inset 0 1px 1px rgba(255,255,255,.08);
}

.display {
  height: 120px;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 22px;
  background: #0d0d11;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: flex-end;
  overflow: hidden;
}

.expression {
  color: #777;
  font-size: 18px;
  min-height: 25px;
}

.answer {
  font-size: 38px;
  font-weight: 600;
  max-width: 100%;
  overflow: hidden;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

button {
  height: 62px;
  border: none;
  border-radius: 18px;
  font-size: 21px;
  font-weight: 600;
  color: white;
  background: #24242b;
  cursor: pointer;
  transition: .12s;
  box-shadow: inset 0 -3px 0 rgba(0,0,0,.25);
}

button:active {
  transform: scale(.92);
}

.operator {
  background: #ff9f0a;
}

.special {
  background: #34343c;
}

.equal {
  background: #30d158;
  grid-column: span 2;
}

.clear {
  background: #ff453a;
}

.zero {
  grid-column: span 2;
}
</style>
</head>

<body>

<div class="calculator">

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="answer" id="answer">0</div>
  </div>

  <div class="buttons">

    <button class="clear" onclick="clearAll()">AC</button>
    <button class="special" onclick="backspace()">⌫</button>
    <button class="special" onclick="percent()">%</button>
    <button class="operator" onclick="press('/')">÷</button>

    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="operator" onclick="press('*')">×</button>

    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button class="operator" onclick="press('-')">−</button>

    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button class="operator" onclick="press('+')">+</button>

    <button class="zero" onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button class="equal" onclick="wrongAnswer()">=</button>

  </div>
</div>

<script>

let current = "";

const expression = document.getElementById("expression");
const answer = document.getElementById("answer");

function press(value) {
  current += value;
  expression.innerText = current;
  answer.innerText = "0";
}

function clearAll() {
  current = "";
  expression.innerText = "";
  answer.innerText = "0";
}

function backspace() {
  current = current.slice(0, -1);
  expression.innerText = current;
}

function percent() {
  if (current !== "") {
    current += "%";
    expression.innerText = current;
  }
}

function wrongAnswer() {

  if (!current) return;

  const funny = [
    "69",
    "42",
    "101",
    "404",
    "7",
    "999",
    "0",
    "-1",
    "∞",
    "23",
    "1337",
    "100"
  ];

  let result = funny[Math.floor(Math.random() * funny.length)];

  answer.innerText = result;
}

</script>

</body>
</html>
